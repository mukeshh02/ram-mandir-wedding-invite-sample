<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#6F2312" />
      <stop offset="55%" stop-color="#481408" />
      <stop offset="100%" stop-color="#280A04" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="30%" stop-color="#F1C40F" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F9E79F" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A1" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C0392B" />
      <stop offset="45%" stop-color="#E67E22" />
      <stop offset="80%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>


  <!-- Card Background -->
  <rect width="200" height="200" rx="16" fill="url(#cardBg)" />
  
  <!-- Outer Gold Border -->
  <rect x="7" y="7" width="186" height="186" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85" />
  
  <!-- Inner Delicate Dotted Border -->
  <rect x="13" y="13" width="174" height="174" rx="8" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.45" />

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.8">
    <!-- Top-Left -->
    <path d="M 12 26 A 14 14 0 0 0 26 12" />
    <circle cx="21" cy="21" r="1.5" fill="#FFEAA7" />
    <!-- Top-Right -->
    <path d="M 188 26 A 14 14 0 0 1 174 12" />
    <circle cx="179" cy="21" r="1.5" fill="#FFEAA7" />
    <!-- Bottom-Left -->
    <path d="M 12 174 A 14 14 0 0 1 26 188" />
    <circle cx="21" cy="179" r="1.5" fill="#FFEAA7" />
    <!-- Bottom-Right -->
    <path d="M 188 174 A 14 14 0 0 0 174 188" />
    <circle cx="179" cy="179" r="1.5" fill="#FFEAA7" />
  </g>

  <!-- Background Divine Aura Ring -->
  <circle cx="100" cy="95" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="4,3" opacity="0.3" />
  <circle cx="100" cy="95" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.18" />

  <!-- Sacred Ganesha Vector Icon -->
  <g filter="url(#subtleShadow)" transform="translate(0, -2)">
    <!-- Crown / Mukut -->
    <path d="M 91 48 L 100 35 L 109 48 L 105 53 L 95 53 Z" fill="url(#goldGrad)" />
    <circle cx="100" cy="34" r="2.5" fill="#FFEAA7" />
    <line x1="91" y1="53" x2="109" y2="53" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="94" y1="56" x2="106" y2="56" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />

    <!-- Forehead Tilak (Trishul style) -->
    <path d="M 100 58 L 100 68" stroke="#FF4D4D" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 96 61 Q 100 67 104 61" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <circle cx="100" cy="71" r="1.8" fill="#FFD700" />

    <!-- Head / Brow -->
    <path d="M 82 72 Q 100 65 118 72" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Left Ear (Graceful arc) -->
    <path d="M 82 72 C 60 74 61 98 77 102 C 81 103 84 99 84 94" stroke="url(#goldGrad)" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <path d="M 75 80 Q 69 90 77 96" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round" />

    <!-- Right Ear -->
    <path d="M 118 72 C 140 74 139 98 123 102 C 119 103 116 99 116 94" stroke="url(#goldGrad)" stroke-width="2.4" fill="none" stroke-linecap="round" />
    <path d="M 125 80 Q 131 90 123 96" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.6" stroke-linecap="round" />

    <!-- Trunk (Sinuous graceful trunk turning left with Modak) -->
    <path d="M 96 76 C 96 95 93 116 82 122 C 74 126 69 118 75 113 C 80 109 84 114 83 118" stroke="url(#goldGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 104 76 C 104 92 101 108 93 118 C 88 124 81 125 78 121" stroke="url(#goldGrad)" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round" />

    <!-- Modak / Laddu in trunk -->
    <ellipse cx="73" cy="111" rx="4.5" ry="4" fill="#FFC107" stroke="url(#goldGrad)" stroke-width="1" />
    <circle cx="73" cy="108" r="1" fill="#FFF" />

    <!-- Eyes -->
    <ellipse cx="90" cy="78" rx="2.2" ry="1.2" fill="#FFEAA7" transform="rotate(-10, 90, 78)" />
    <ellipse cx="110" cy="78" rx="2.2" ry="1.2" fill="#FFEAA7" transform="rotate(10, 110, 78)" />

    <!-- Tusk (Ekdanta) -->
    <path d="M 108 94 L 115 99 L 109 100 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- Modak Bowl / Blessings / Base pedestal -->
    <path d="M 72 138 Q 100 144 128 138" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 80 142 Q 100 147 120 142" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Divine Caption -->
  <text x="100" y="166" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="11.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">SHREE GANESH</text>
  <line x1="60" y1="172" x2="140" y2="172" stroke="url(#goldLine)" stroke-width="1" />
</svg>