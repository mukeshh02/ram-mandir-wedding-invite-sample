<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#6F2312" />
      <stop offset="55%" stop-color="#481408" />
      <stop offset="100%" stop-color="#280A04" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="30%" stop-color="#F1C40F" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F9E79F" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A1" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C0392B" />
      <stop offset="45%" stop-color="#E67E22" />
      <stop offset="80%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>


  <!-- Card Background -->
  <rect width="200" height="200" rx="16" fill="url(#cardBg)" />
  
  <!-- Outer Gold Border -->
  <rect x="7" y="7" width="186" height="186" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85" />
  
  <!-- Inner Delicate Dotted Border -->
  <rect x="13" y="13" width="174" height="174" rx="8" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.45" />

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.8">
    <!-- Top-Left -->
    <path d="M 12 26 A 14 14 0 0 0 26 12" />
    <circle cx="21" cy="21" r="1.5" fill="#FFEAA7" />
    <!-- Top-Right -->
    <path d="M 188 26 A 14 14 0 0 1 174 12" />
    <circle cx="179" cy="21" r="1.5" fill="#FFEAA7" />
    <!-- Bottom-Left -->
    <path d="M 12 174 A 14 14 0 0 1 26 188" />
    <circle cx="21" cy="179" r="1.5" fill="#FFEAA7" />
    <!-- Bottom-Right -->
    <path d="M 188 174 A 14 14 0 0 0 174 188" />
    <circle cx="179" cy="179" r="1.5" fill="#FFEAA7" />
  </g>

  <!-- Background Divine Aura Ring -->
  <circle cx="100" cy="95" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="4,3" opacity="0.3" />
  <circle cx="100" cy="95" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.18" />

  <g filter="url(#subtleShadow)" transform="translate(0, -2)">
    <!-- Coconut / Nariyal with Kalava -->
    <ellipse cx="100" cy="62" rx="18" ry="21" fill="url(#goldGrad)" />
    <!-- Coconut fibers & kalava band -->
    <path d="M 100 41 Q 101 36 100 33" stroke="#FFEAA7" stroke-width="2" stroke-linecap="round" />
    <path d="M 84 62 Q 100 68 116 62" stroke="#B03A2E" stroke-width="2.5" fill="none" />
    <path d="M 86 58 Q 100 64 114 58" stroke="#FFEAA7" stroke-width="1" fill="none" />
    <path d="M 86 66 Q 100 72 114 66" stroke="#FFEAA7" stroke-width="1" fill="none" />

    <!-- Mango Leaves (Aam ke patte) radiating behind coconut -->
    <!-- Left Leaf -->
    <path d="M 86 74 C 65 65 58 48 56 36 C 68 45 78 58 84 72 Z" fill="url(#goldGrad)" opacity="0.95" />
    <path d="M 86 74 C 65 65 58 48 56 36" stroke="#AA7C11" stroke-width="1" fill="none" />
    <!-- Far Left Leaf -->
    <path d="M 82 80 C 62 76 46 64 42 54 C 54 62 68 72 80 79 Z" fill="url(#goldGrad)" opacity="0.8" />
    <!-- Right Leaf -->
    <path d="M 114 74 C 135 65 142 48 144 36 C 132 45 122 58 116 72 Z" fill="url(#goldGrad)" opacity="0.95" />
    <path d="M 114 74 C 135 65 142 48 144 36" stroke="#AA7C11" stroke-width="1" fill="none" />
    <!-- Far Right Leaf -->
    <path d="M 118 80 C 138 76 154 64 158 54 C 146 62 132 72 120 79 Z" fill="url(#goldGrad)" opacity="0.8" />
    <!-- Center Top Leaf -->
    <path d="M 94 52 C 96 38 100 24 100 22 C 100 24 104 38 106 52 Z" fill="url(#goldGrad)" opacity="0.85" />

    <!-- Kalash Neck / Rim -->
    <ellipse cx="100" cy="84" rx="26" ry="6" fill="url(#goldGrad)" />
    <ellipse cx="100" cy="84" rx="24" ry="4.5" fill="#481408" opacity="0.5" />
    <!-- Floral Garland / Moli around neck -->
    <path d="M 75 87 Q 100 96 125 87" stroke="#FF4D4D" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="85" cy="91" r="2" fill="#FFEAA7" />
    <circle cx="100" cy="93" r="2.2" fill="#FFEAA7" />
    <circle cx="115" cy="91" r="2" fill="#FFEAA7" />

    <!-- Kalash Pot Body (Sacred Kumbha) -->
    <path d="M 76 87 C 62 100 60 128 78 136 C 88 140 112 140 122 136 C 140 128 138 100 124 87 Z" fill="url(#goldGrad)" />

    <!-- Pot Base / Pedestal -->
    <path d="M 82 136 L 78 143 Q 100 147 122 143 L 118 136 Z" fill="url(#goldGrad)" />

    <!-- Sacred Swastik etched on Kalash body -->
    <g stroke="#6F2312" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(100, 112)">
      <!-- Center arms -->
      <path d="M 0 -10 L 0 10" />
      <path d="M -10 0 L 10 0" />
      <!-- Swastik bends -->
      <path d="M 0 -10 L 8 -10" />
      <path d="M 10 0 L 10 8" />
      <path d="M 0 10 L -8 10" />
      <path d="M -10 0 L -10 -8" />
      <!-- 4 Divine Dots -->
      <circle cx="4.5" cy="-4.5" r="1.3" fill="#6F2312" stroke="none" />
      <circle cx="4.5" cy="5.5" r="1.3" fill="#6F2312" stroke="none" />
      <circle cx="-4.5" cy="5.5" r="1.3" fill="#6F2312" stroke="none" />
      <circle cx="-4.5" cy="-4.5" r="1.3" fill="#6F2312" stroke="none" />
    </g>
  </g>

  <!-- Caption -->
  <text x="100" y="166" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="11.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">MANGAL KALASH</text>
  <line x1="55" y1="172" x2="145" y2="172" stroke="url(#goldLine)" stroke-width="1" />
</svg>