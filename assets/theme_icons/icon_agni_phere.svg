<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#6F2312" />
      <stop offset="55%" stop-color="#481408" />
      <stop offset="100%" stop-color="#280A04" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="30%" stop-color="#F1C40F" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F9E79F" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A1" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C0392B" />
      <stop offset="45%" stop-color="#E67E22" />
      <stop offset="80%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>


  <!-- Card Background -->
  <rect width="200" height="200" rx="16" fill="url(#cardBg)" />
  
  <!-- Outer Gold Border -->
  <rect x="7" y="7" width="186" height="186" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85" />
  
  <!-- Inner Delicate Dotted Border -->
  <rect x="13" y="13" width="174" height="174" rx="8" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.45" />

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.8">
    <!-- Top-Left -->
    <path d="M 12 26 A 14 14 0 0 0 26 12" />
    <circle cx="21" cy="21" r="1.5" fill="#FFEAA7" />
    <!-- Top-Right -->
    <path d="M 188 26 A 14 14 0 0 1 174 12" />
    <circle cx="179" cy="21" r="1.5" fill="#FFEAA7" />
    <!-- Bottom-Left -->
    <path d="M 12 174 A 14 14 0 0 1 26 188" />
    <circle cx="21" cy="179" r="1.5" fill="#FFEAA7" />
    <!-- Bottom-Right -->
    <path d="M 188 174 A 14 14 0 0 0 174 188" />
    <circle cx="179" cy="179" r="1.5" fill="#FFEAA7" />
  </g>

  <!-- Background Divine Aura Ring -->
  <circle cx="100" cy="95" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="4,3" opacity="0.3" />
  <circle cx="100" cy="95" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.18" />

  <g filter="url(#subtleShadow)" transform="translate(0, -3)">
    <!-- Sacred Havan Kund (Tiered Stepped Pyramid Pot) -->
    <!-- Bottom Base Tier -->
    <polygon points="45,140 155,140 145,148 55,148" fill="url(#goldGrad)" stroke="#875A08" stroke-width="1" />
    <!-- Middle Tier -->
    <polygon points="54,128 146,128 140,140 60,140" fill="url(#goldGrad)" stroke="#AA7C11" stroke-width="1" />
    <!-- Top Step Tier -->
    <polygon points="62,116 138,116 132,128 68,128" fill="url(#goldGrad)" stroke="#875A08" stroke-width="1" />
    <!-- Rim / Top Open Cavity -->
    <ellipse cx="100" cy="116" rx="38" ry="8" fill="#3E0C06" stroke="url(#goldGrad)" stroke-width="2" />
    <!-- Hot Glowing Embers inside cavity -->
    <ellipse cx="100" cy="116" rx="32" ry="5.5" fill="#E74C3C" opacity="0.8" />
    <ellipse cx="100" cy="116" rx="20" ry="3" fill="#F39C12" />

    <!-- Sacred Wood Logs (Samidha) -->
    <line x1="78" y1="117" x2="118" y2="108" stroke="#5D4037" stroke-width="4.5" stroke-linecap="round" />
    <line x1="122" y1="117" x2="82" y2="108" stroke="#4E342E" stroke-width="4.5" stroke-linecap="round" />

    <!-- Holy Rising Flames of Agni Dev -->
    <!-- Back Glow Flame -->
    <path d="M 100 112 C 70 100 75 75 88 62 C 92 74 96 70 100 50 C 105 68 112 60 115 65 C 128 78 130 100 100 112 Z" fill="url(#flameGrad)" opacity="0.6" filter="url(#goldGlow)" />
    <!-- Outer Main Flame -->
    <path d="M 100 112 C 78 98 80 80 92 68 C 95 78 100 70 100 42 C 106 65 110 68 114 74 C 124 88 120 100 100 112 Z" fill="url(#flameGrad)" />
    <!-- Middle Fiery Orange Flame -->
    <path d="M 100 112 C 86 102 88 88 95 78 C 98 84 100 80 100 60 C 104 76 108 80 110 84 C 116 94 114 102 100 112 Z" fill="#F39C12" />
    <!-- Core Bright Golden Flame -->
    <path d="M 100 112 C 92 105 92 95 97 88 C 99 92 100 90 100 74 C 102 86 104 90 105 92 C 109 98 108 105 100 112 Z" fill="#FFF9C4" />

    <!-- Sacred Gathbandhan Wedding Knot Motif encircling Kund base -->
    <path d="M 68 144 C 82 152 118 152 132 144" stroke="#FF4D4D" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 72 147 C 85 155 115 155 128 147" stroke="url(#goldGrad)" stroke-width="1.2" fill="none" stroke-linecap="round" />
    <!-- Knot Center -->
    <circle cx="100" cy="151" r="3.5" fill="#B03A2E" stroke="url(#goldGrad)" stroke-width="1.2" />
  </g>

  <!-- Caption -->
  <text x="100" y="166" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="11.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">PAVITRA PHERE</text>
  <line x1="55" y1="172" x2="145" y2="172" stroke="url(#goldLine)" stroke-width="1" />
</svg>