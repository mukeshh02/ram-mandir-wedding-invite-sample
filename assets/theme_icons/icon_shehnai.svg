<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">

  <defs>
    <radialGradient id="cardBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#6F2312" />
      <stop offset="55%" stop-color="#481408" />
      <stop offset="100%" stop-color="#280A04" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="30%" stop-color="#F1C40F" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="85%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F9E79F" />
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A1" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C0392B" />
      <stop offset="45%" stop-color="#E67E22" />
      <stop offset="80%" stop-color="#F1C40F" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>


  <!-- Card Background -->
  <rect width="200" height="200" rx="16" fill="url(#cardBg)" />
  
  <!-- Outer Gold Border -->
  <rect x="7" y="7" width="186" height="186" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" opacity="0.85" />
  
  <!-- Inner Delicate Dotted Border -->
  <rect x="13" y="13" width="174" height="174" rx="8" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.45" />

  <!-- Corner Flourishes -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.8">
    <!-- Top-Left -->
    <path d="M 12 26 A 14 14 0 0 0 26 12" />
    <circle cx="21" cy="21" r="1.5" fill="#FFEAA7" />
    <!-- Top-Right -->
    <path d="M 188 26 A 14 14 0 0 1 174 12" />
    <circle cx="179" cy="21" r="1.5" fill="#FFEAA7" />
    <!-- Bottom-Left -->
    <path d="M 12 174 A 14 14 0 0 1 26 188" />
    <circle cx="21" cy="179" r="1.5" fill="#FFEAA7" />
    <!-- Bottom-Right -->
    <path d="M 188 174 A 14 14 0 0 0 174 188" />
    <circle cx="179" cy="179" r="1.5" fill="#FFEAA7" />
  </g>

  <!-- Background Divine Aura Ring -->
  <circle cx="100" cy="95" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="4,3" opacity="0.3" />
  <circle cx="100" cy="95" r="62" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.18" />

  <g filter="url(#subtleShadow)" transform="translate(0, -4)">
    <!-- Wedding Dholak in background -->
    <g transform="translate(100, 102) rotate(-12)">
      <!-- Dholak Barrel -->
      <ellipse cx="0" cy="0" rx="42" ry="22" fill="url(#goldGrad)" />
      <!-- Dholak Rings & Ropes -->
      <path d="M -42 0 C -30 18 30 18 42 0 C 30 -18 -30 -18 -42 0 Z" fill="none" stroke="#6F2312" stroke-width="1.2" opacity="0.7" />
      <!-- Left drum head -->
      <ellipse cx="-42" cy="0" rx="7" ry="21" fill="#481408" stroke="url(#goldGrad)" stroke-width="2" />
      <ellipse cx="-42" cy="0" rx="3.5" ry="12" fill="#280A04" />
      <!-- Right drum head -->
      <ellipse cx="42" cy="0" rx="7" ry="21" fill="#481408" stroke="url(#goldGrad)" stroke-width="2" />
      <ellipse cx="42" cy="0" rx="3.5" ry="12" fill="#280A04" />
      <!-- Ropes (Woven Zigzag) -->
      <path d="M -42 -10 L -25 15 L 0 -15 L 25 15 L 42 -10" stroke="#6F2312" stroke-width="1.8" fill="none" />
      <path d="M -42 10 L -25 -15 L 0 15 L 25 -15 L 42 10" stroke="#6F2312" stroke-width="1.8" fill="none" />
    </g>

    <!-- Two Crossed Royal Shehnais in Foreground -->
    <!-- Shehnai 1 (Slanted Left to Right) -->
    <g transform="translate(100, 80) rotate(32)">
      <!-- Reed mouthpiece -->
      <rect x="-2" y="-55" width="4" height="12" fill="#FFEAA7" rx="1" />
      <line x1="-3" y1="-43" x2="3" y2="-43" stroke="#B03A2E" stroke-width="1.5" />
      <!-- Body pipe tapering down -->
      <path d="M -2.5 -43 L -7 20 L -16 42 L 16 42 L 7 20 L 2.5 -43 Z" fill="url(#goldGrad)" stroke="#875A08" stroke-width="1" />
      <!-- Finger holes -->
      <circle cx="0" cy="-28" r="1.5" fill="#481408" />
      <circle cx="0" cy="-16" r="1.5" fill="#481408" />
      <circle cx="0" cy="-4" r="1.5" fill="#481408" />
      <circle cx="0" cy="8" r="1.5" fill="#481408" />
      <!-- Flare Bell at Bottom -->
      <ellipse cx="0" cy="42" rx="16" ry="6" fill="url(#goldGrad)" stroke="#FFEAA7" stroke-width="1.2" />
      <ellipse cx="0" cy="42" rx="12" ry="4" fill="#5F250F" />
      <!-- Tassels / Latkan hanging from bell -->
      <path d="M -10 44 Q -14 56 -10 65" stroke="#FF4D4D" stroke-width="1.5" fill="none" />
      <circle cx="-10" cy="66" r="2.5" fill="#FFEAA7" />
    </g>

    <!-- Shehnai 2 (Slanted Right to Left) -->
    <g transform="translate(100, 80) rotate(-32)">
      <!-- Reed mouthpiece -->
      <rect x="-2" y="-55" width="4" height="12" fill="#FFEAA7" rx="1" />
      <line x1="-3" y1="-43" x2="3" y2="-43" stroke="#B03A2E" stroke-width="1.5" />
      <!-- Body pipe -->
      <path d="M -2.5 -43 L -7 20 L -16 42 L 16 42 L 7 20 L 2.5 -43 Z" fill="url(#goldGrad)" stroke="#875A08" stroke-width="1" />
      <!-- Finger holes -->
      <circle cx="0" cy="-28" r="1.5" fill="#481408" />
      <circle cx="0" cy="-16" r="1.5" fill="#481408" />
      <circle cx="0" cy="-4" r="1.5" fill="#481408" />
      <circle cx="0" cy="8" r="1.5" fill="#481408" />
      <!-- Flare Bell at Bottom -->
      <ellipse cx="0" cy="42" rx="16" ry="6" fill="url(#goldGrad)" stroke="#FFEAA7" stroke-width="1.2" />
      <ellipse cx="0" cy="42" rx="12" ry="4" fill="#5F250F" />
      <!-- Tassels -->
      <path d="M 10 44 Q 14 56 10 65" stroke="#FF4D4D" stroke-width="1.5" fill="none" />
      <circle cx="10" cy="66" r="2.5" fill="#FFEAA7" />
    </g>

    <!-- Festive Music Sparkles / Stars -->
    <path d="M 52 48 Q 58 48 58 42 Q 58 48 64 48 Q 58 48 58 54 Q 58 48 52 48 Z" fill="#FFEAA7" />
    <path d="M 144 48 Q 150 48 150 42 Q 150 48 156 48 Q 150 48 150 54 Q 150 48 144 48 Z" fill="#FFEAA7" />
  </g>

  <!-- Caption -->
  <text x="100" y="166" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="11.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">SHUBH SHEHNAI</text>
  <line x1="55" y1="172" x2="145" y2="172" stroke="url(#goldLine)" stroke-width="1" />
</svg>